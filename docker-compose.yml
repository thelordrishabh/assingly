services:
  assingly:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: assingly-app
    restart: unless-stopped
    ports:
      - "${PORT:-3001}:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_PATH=/app/data/assingly.db
      - UPLOAD_DIR=/app/data/private-uploads
    volumes:
      - assingly_data:/app/data

volumes:
  assingly_data:
    name: assingly_data
