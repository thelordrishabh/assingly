# ==============================================================================
# Fly.io Configuration (fly.toml)
# https://fly.io/docs/reference/configuration/
# ==============================================================================

app = "assingly"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3001"
  DATABASE_PATH = "/app/data/assingly.db"
  UPLOAD_DIR = "/app/data/private-uploads"

[mounts]
  source = "assingly_data"
  destination = "/app/data"
  initial_size = "1gb"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/api/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
